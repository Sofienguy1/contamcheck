[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "contamcheck"
dynamic = ["version"]
description = "Check whether a language model has memorised a benchmark."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Sofie Nguyen" }]
keywords = ["llm", "benchmark", "contamination", "evaluation", "memorization", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24", "torch>=2.1", "transformers>=4.56", "datasets>=2.18", "tqdm"]

[project.urls]
Homepage = "https://github.com/Sofienguy1/contamcheck"
Issues = "https://github.com/Sofienguy1/contamcheck/issues"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
contamcheck = "contamcheck.cli:main"

[tool.setuptools.dynamic]
version = { attr = "contamcheck.__version__" }

[tool.setuptools.packages.find]
include = ["contamcheck*"]
